<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkWatch | Security Login</title>
    <!-- Favicon for Browser Tab -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.62);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 20px 50px -10px rgba(31, 38, 135, 0.12), inset 0 1px 2px 0 rgba(255, 255, 255, 0.95);
            animation: fadeInSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 10px 24px rgba(2, 132, 199, 0.38));
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-logo:hover {
            transform: scale(1.06);
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .login-header h2 span {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 28px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 12px 16px 12px 44px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            color: #0f172a;
            outline: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .form-input:focus {
            background: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        .form-input:focus + i,
        .input-group:focus-within i {
            color: #0284c7;
        }

        .btn-login {
            margin-top: 10px;
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 24px -4px rgba(2, 132, 199, 0.45);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -4px rgba(2, 132, 199, 0.55);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .error-banner {
            background: rgba(225, 29, 72, 0.1);
            border: 1px solid rgba(225, 29, 72, 0.3);
            color: #e11d48;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-footer {
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* Dark Theme overrides for Login Card */
        [data-theme="liquid-dark"] .login-card {
            background: rgba(15, 23, 42, 0.62);
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.6), inset 0 1px 2px 0 rgba(255, 255, 255, 0.16);
        }

        [data-theme="liquid-dark"] .login-header h2 {
            color: #f8fafc;
        }

        [data-theme="liquid-dark"] .login-header p {
            color: #94a3b8;
        }

        [data-theme="liquid-dark"] .form-label {
            color: #cbd5e1;
        }

        [data-theme="liquid-dark"] .form-input {
            background: rgba(15, 23, 42, 0.70);
            border-color: rgba(255, 255, 255, 0.12);
            color: #f8fafc;
        }

        [data-theme="liquid-dark"] .form-input:focus {
            background: rgba(15, 23, 42, 0.95);
            border-color: #0284c7;
        }
    </style>
</head>
<body>
    <!-- Animated Liquid Glass Mesh Background -->
    <div class="liquid-canvas">
        <div class="liquid-orb orb-1"></div>
        <div class="liquid-orb orb-2"></div>
        <div class="liquid-orb orb-3"></div>
        <div class="liquid-orb orb-4"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="DarkWatch Shield Logo">
            </div>
            <div class="login-header">
                <h2>Dark<span>Watch</span></h2>
                <p>Protected Intelligence & Telemetry Console</p>
            </div>

            {% if error %}
            <div class="error-banner">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form class="login-form" method="POST" action="/login">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-group">
                        <input class="form-input" type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username" autofocus>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <input class="form-input" type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket"></i> Authenticate & Access
                </button>
            </form>
        </div>
    </div>

    <script>
        // Synchronize theme on login page
        const savedTheme = localStorage.getItem("darkwatch_theme") || "liquid-light";
        if (savedTheme === "liquid-dark" || savedTheme === "liquid-light") {
            document.documentElement.setAttribute("data-theme", savedTheme);
        }
    </script>
</body>
</html>
